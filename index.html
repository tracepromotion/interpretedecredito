<!DOCTYPE html><html lang='pt-BR'><head><meta charset='utf-8'>
<title>Interprete Crédito Tracecom PRO+</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{background:#0b0b0b;color:#fff;font-family:Segoe UI;margin:0}
header{background:#111;padding:15px;text-align:center}h1{color:#d4af37}
.container{max-width:1300px;margin:auto;padding:20px}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:15px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.help{border-radius:50%;cursor:pointer}.close{float:right;background:#c0392b;color:#fff;border:none;border-radius:50%;width:32px;height:32px}
.result{text-align:center;font-size:42px;font-weight:bold}
.upload-area{
    min-height:180px;

    display:flex;
    justify-content:center;
    align-items:center;

    border:2px dashed #d4af37;

    transition:.3s;
}

.upload-area:hover{
    border-color:#f1c40f;
    box-shadow:0 0 20px rgba(212,175,55,.25);
}
</style></head><body>
<header><h1>🏆 Intérprete de Crédito - Tracecom PRO+</h1></header>
<div class='container'>
<div class='card'><h3>Régua</h3>
<div class='grid'>
<div>Score Min <button class='help' onclick="h('score')">?</button><br><input id='score' value='450'></div>
<div>Máx Débitos <button class='help' onclick="h('deb')">?</button><br><input id='maxdeb' value='3'></div>
<div>Peso Internet <button class='help' onclick="h('int')">?</button><br><input id='pi' value='35'></div>
<div>Peso Essenciais <button class='help' onclick="h('ess')">?</button><br><input id='pe' value='25'></div>
<div>Peso Bancos <button class='help' onclick="h('ban')">?</button><br><input id='pb' value='15'></div>
<div>Peso CPF <button class='help' onclick="h('cpf')">?</button><br><input id='pcpf' value='35'></div>
</div></div>
<div class='card upload-area'>
    <input type='file' id='pdfFile' accept='.pdf'>
</div>
<div id='report' class='card'>Aguardando PDF...</div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function h(t){const x={score:'Score mínimo.',deb:'Quantidade máxima de registros.',int:'Telecom.',ess:'Água e energia.',ban:'Bancos/cartões.',cpf:'CPF irregular.'};alert(x[t]);}
function resetR(){document.getElementById('report').innerHTML='Aguardando PDF...';document.getElementById('pdfFile').value='';}
async function txt(file){const d=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:d}).promise;let t='';for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i);let c=await p.getTextContent();t+=c.items.map(v=>v.str).join(' ')+' ';}return t;}
function m(r,x){let a=x.match(r);return a?a[1].trim():'';}
function gerar(t){
let nome=m(/Nome Completo\s+([A-ZÀ-Ú\s]+?)\s+Documento/i,t)||'Não localizado';
let score=parseInt(m(/Pontuação\s+(\d+)/i,t)||0);
let valor=m(/Débitos Registrados\s+R\$\s*([\d\.,]+)/i,t)||'0';
let debs=(t.match(/Condição\s+Ativo/gi)||[]).length;
let empresas=[];
['LIGHT','NUBANK','NU FINANCEIRA','BRASIL CARD','CREDSYSTEM','CLARO','VIVO','TIM','OI'].forEach(e=>{if(t.toUpperCase().includes(e))empresas.push(e)});
let seg=[];
if(empresas.some(x=>['CLARO','VIVO','TIM','OI'].includes(x))) seg.push('Telecomunicações');
if(empresas.some(x=>['LIGHT'].includes(x))) seg.push('Energia');
if(empresas.some(x=>['NUBANK','NU FINANCEIRA','BRASIL CARD','CREDSYSTEM'].includes(x))) seg.push('Crédito e Cartões');

let risco=0;
if(score<400)risco+=50; else if(score<450)risco+=40; else if(score<500)risco+=30; else if(score<600)risco+=20;
if(debs>3)risco+=35; else risco+=debs*5;
if(/Pendente na Receita Federal/i.test(t))risco+=35;
if(seg.includes('Telecomunicações'))risco+=35;
if(seg.includes('Energia'))risco+=25;
if(seg.includes('Crédito e Cartões'))risco+=15;

let cls='APROVADO',cor='#2ecc71';
if(risco>100){cls='REPROVADO';cor='#e74c3c';}
else if(risco>60){cls='APROVAÇÃO CONDICIONAL';cor='#e67e22';}
else if(risco>30){cls='APROVADO COM ATENÇÃO';cor='#f1c40f';}

document.getElementById('report').innerHTML=`<button class='close' onclick='resetR()'>✕</button>
<h2>📋 Dados do Cliente</h2><p><b>Nome:</b> ${nome}</p>
<h2>📊 Resumo Financeiro</h2>
<p><b>Score:</b> ${score}</p><p><b>Registros de Débito:</b> ${debs}</p><p><b>Valor Total:</b> R$ ${valor}</p>
<h2>🏦 Empresas Encontradas</h2><p>${empresas.join(', ')||'Nenhuma identificada'}</p>
<h2>📂 Segmentos Encontrados</h2><p>${seg.join(', ')||'Nenhum identificado'}</p>
<h2>🧠 Interpretação Inteligente</h2>
<p>Foram identificados ${debs} registros de débito. Os principais segmentos encontrados foram: ${seg.join(', ')||'não identificados'}. ${seg.includes('Telecomunicações')?'Débitos em telecomunicações possuem peso elevado por serem similares ao serviço da Tracecom. ':''}${seg.includes('Energia')?'Débitos em serviços essenciais elevam a criticidade da análise. ':''}Risco estimado: ${risco}%.</p>
<div class='result' style='color:${cor}'>${cls}</div>`;
}
document.getElementById('pdfFile').addEventListener('change',async e=>{
let t=await txt(e.target.files[0]);gerar(t);
});
</script></body></html>
