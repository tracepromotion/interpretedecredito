<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interprete de Crédito - Tracecom</title>
<style>
body{background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;margin:0}
header{padding:20px;text-align:center;background:#111;border-bottom:1px solid #444}
h1{color:#d4af37}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:15px;margin:10px 0}
.dropzone{border:2px dashed #d4af37;padding:50px;text-align:center;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input{width:80px}
.result{font-size:36px;font-weight:bold;text-align:center;margin-top:20px}
.aprovado{color:#2ecc71}.reprovado{color:#e74c3c}
</style>
</head>
<body>
<header>
<h1>🏆 Interprete de Crédito - Tracecom</h1>
<p>Dashboard Premium</p>
</header>

<div class="container">
<div class="card">
<h2>Configuração das Réguas</h2>
<div class="grid">
<label>Score mínimo <input id="scoreMin" value="450"></label>
<label>Máx. Débitos <input id="maxDebitos" value="3"></label>
<label>Peso Internet <input id="pesoInternet" value="35"></label>
<label>Peso Essenciais <input id="pesoEssenciais" value="25"></label>
</div>
</div>

<div class="card">
<div class="dropzone">
📄 Arraste o PDF aqui ou clique para selecionar<br>
<input type="file" id="pdfFile" accept=".pdf">
</div>
</div>

<div id="report" class="card">
<h2>Relatório</h2>
<p>Carregue um PDF para iniciar.</p>
</div>
</div>

<script>
// Estrutura pronta para integração com PDF.js.
// Inserir pdf.min.js e implementar extração conforme modelo utilizado.

function renderMock(){
document.getElementById("report").innerHTML=`
<h2>📋 Dados do Cliente</h2>
<p><b>Nome:</b> Exemplo</p>

<h2>📊 Score</h2>
<p>401</p>

<h2>💰 Débitos</h2>
<p>R$ 4.529,06</p>

<h2>⚠️ Fatores de Atenção</h2>
<ul>
<li>CPF pendente</li>
<li>7 débitos ativos</li>
<li>Dívidas com serviços essenciais</li>
</ul>

<h2>✅ Pontos Positivos</h2>
<ul>
<li>Sem protestos</li>
<li>Cadastro positivo</li>
</ul>

<h2>🧠 Interpretação Inteligente</h2>
<p>Perfil com sinais relevantes de inadimplência para serviços recorrentes.</p>

<div class="result reprovado">REPROVADO</div>
`;
}

document.getElementById("pdfFile").addEventListener("change", renderMock);
</script>
</body>
</html>
